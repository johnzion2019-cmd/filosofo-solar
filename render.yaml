# SQLite lives on a persistent disk, so this service stays on a single instance.
# Disks require a paid web service. `starter` is the legacy plan id Render still accepts.
services:
  - type: web
    name: filosofo-solar
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    healthCheckPath: /api/health
    disk:
      name: filosofo-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /data/filosofo.sqlite
      - key: SETTINGS_SECRET
        generateValue: true
      - key: INGEST_API_KEY
        generateValue: true
      - key: DEYE_REGION
        value: eu
      - key: DEYE_DEVICE_SN
        value: "2508073177"
      - key: APP_PIN
        sync: false
      - key: DEYE_APP_ID
        sync: false
      - key: DEYE_APP_SECRET
        sync: false
      - key: DEYE_EMAIL
        sync: false
      - key: DEYE_PASSWORD
        sync: false
      - key: DEYE_COMPANY_ID
        sync: false
      - key: DEYE_STATION_ID
        sync: false
      - key: POLL_INTERVAL_SEC
        value: "60"
